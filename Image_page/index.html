<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - 静态·唤醒</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="gallery-container">

        <!-- 标题区域 -->
        <div class="gallery-item text-block" data-grid-area="1 / 1 / 2 / 3">
            <h1>静态·唤醒</h1>
            <p>将鼠标悬停在照片上，唤醒色彩</p>
        </div>

        <!-- 照片网格区域 -->
        <!-- 使用data-grid-area属性控制位置：row-start / col-start / row-end / col-end -->

        <div class="gallery-item photo-block" data-grid-area="2 / 1 / 4 / 2">
            <img src="images/photo1.jpg" alt="Photo 1">
            <div class="caption">作品一</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="2 / 2 / 3 / 4">
            <img src="images/photo2.jpg" alt="Photo 2">
            <div class="caption">作品二</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="3 / 2 / 5 / 3">
            <img src="images/photo3.jpg" alt="Photo 3">
            <div class="caption">作品三</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="3 / 3 / 4 / 4">
            <img src="images/photo4.jpg" alt="Photo 4">
            <div class="caption">作品四</div>
        </div>

        <div class="gallery-item text-block" data-grid-area="4 / 1 / 5 / 2">
            <h3>艺术与光影</h3>
            <p>每一张照片都在等待被发现</p>
        </div>

        <div class="gallery-item photo-block" data-grid-area="4 / 3 / 6 / 4">
            <img src="images/photo5.jpg" alt="Photo 5">
            <div class="caption">作品五</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="5 / 1 / 6 / 3">
            <img src="images/photo6.jpg" alt="Photo 6">
            <div class="caption">作品六</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="6 / 1 / 7 / 2">
            <img src="images/photo7.jpg" alt="Photo 7">
            <div class="caption">作品七</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="6 / 2 / 7 / 4">
            <img src="images/photo8.jpg" alt="Photo 8">
            <div class="caption">作品八</div>
        </div>

        <!-- 添加更多照片只需复制上面的photo-block结构，并修改data-grid-area -->

    </div>

    <script src="script.js"></script>
</body>
</html>

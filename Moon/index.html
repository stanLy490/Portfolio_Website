<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>自动旋转的月球（调试增强版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 确保画布填满整个浏览器窗口 */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
        }

        canvas {
            display: block;
        }

        /* 加载提示样式 */
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 1.5rem;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            padding: 1rem 2rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
        }

        /* 交互提示样式 */
        #controls-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #ccc;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <!-- 加载提示：因为大纹理文件加载可能需要时间 -->
    <div id="loading-message">正在加载高分辨率月球纹理...请稍候！</div>

    <!-- 交互提示 -->
    <div id="controls-info">使用鼠标左键拖动旋转视角，滚轮缩放。</div>

    <!-- 引入 Three.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入轨道控制器，用于交互式视角操作 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 全局变量
        let scene, camera, renderer, moon;
        let controls; // 轨道控制器

        // ---------------------------------------------------------------------
        // 步骤一：粘贴您从 GitHub 获取的 **Raw Link (原始链接)**
        // ---------------------------------------------------------------------

        // 【已更新为您的 GitHub Raw URL，并假设在 'main' 分支和 'Moon' 文件夹下】
        const textureFile = 'https://raw.githubusercontent.com/stanLy490/Portfolio_Website/main/Moon/moon_texture.jpg';

        // 原始 NASA 示例 (已注释)
        // const textureFile = 'https://threejs.org/examples/textures/planets/moon_1024.jpg'; 


        // --- 1. 初始化场景、摄像机和渲染器 ---
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510); // 深空背景色

            // 创建透视摄像机 (视角, 宽高比, 近平面, 远平面)
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3; // 将摄像机后移

            // 创建 WebGL 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // --- 2. 轨道控制器 (OrbitControls) ---
            // 允许用户使用鼠标拖动旋转和缩放视角
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.minDistance = 1.5; // 最小缩放距离
            controls.maxDistance = 10;  // 最大缩放距离
            controls.enableDamping = true; // 启用阻尼效果，让旋转更平滑
            controls.dampingFactor = 0.05;

            // --- 3. 加载纹理并创建月球几何体 ---
            const textureLoader = new THREE.TextureLoader();
            const loadingMessage = document.getElementById('loading-message');

            // 提示：GitHub Raw Link 默认支持跨域，不需要额外的配置。

            textureLoader.load(
                textureFile, // 您的纹理文件名 (或公共 URL)
                function (texture) {
                    // 成功加载纹理
                    console.log(`[Three.js Debug] 纹理加载成功！文件路径: ${textureFile}`);
                    loadingMessage.style.display = 'none'; // 隐藏加载提示

                    // 提高纹理过滤质量
                    texture.minFilter = THREE.LinearMipmapLinearFilter;
                    texture.magFilter = THREE.LinearFilter;

                    // 创建球体几何体
                    const geometry = new THREE.SphereGeometry(1, 128, 128);

                    // 创建材质，使用 MeshStandardMaterial 支持光照
                    const material = new THREE.MeshStandardMaterial({
                        map: texture,
                        metalness: 0,
                        roughness: 1,
                    });

                    // 创建月球网格
                    moon = new THREE.Mesh(geometry, material);
                    moon.rotation.y = Math.PI * 0.5; // 初始旋转调整
                    scene.add(moon);
                },
                // 加载过程中的回调 (进度)
                function (xhr) {
                    const totalSize = xhr.total > 0 ? (xhr.total / (1024 * 1024)).toFixed(2) + 'MB' : '未知大小';
                    const loadedSize = (xhr.loaded / (1024 * 1024)).toFixed(2);
                    const percent = Math.round(xhr.loaded / xhr.total * 100);
                    loadingMessage.textContent = `正在加载高分辨率月球纹理 (${loadedSize}/${totalSize})... ${percent}%`;
                },
                // 加载失败的回调
                function (err) {
                    console.error('--- 纹理加载严重错误！请查看以下详细信息：---');
                    console.error(`尝试加载的路径是: ${textureFile}`);

                    if (err && err.target && err.target.status === 0) {
                        console.error('错误代码: 0。这通常是 **文件路径不正确** 或 **跨域安全限制 (CORS)** 导致的。');
                        console.error('如果您是通过 "file:///..." 打开的网页，请尝试使用一个本地Web服务器（如VS Code的Live Server）打开此文件。');
                    } else if (err instanceof Error) {
                        // Three.js 加载失败抛出的错误对象
                        console.error('错误对象详情:', err);
                    } else {
                        // 其他可能的错误信息
                        console.error('原始错误对象:', err);
                    }

                    loadingMessage.textContent = '纹理加载失败！显示默认球体。请检查浏览器控制台 (F12) 获取详细错误。';

                    // 加载失败时，创建一个基本的灰色球体
                    const geometry = new THREE.SphereGeometry(1, 128, 128);
                    const material = new THREE.MeshBasicMaterial({ color: 0x999999 });
                    moon = new THREE.Mesh(geometry, material);
                    moon.rotation.y = Math.PI * 0.5; // 保持旋转角度一致
                    scene.add(moon);
                }
            );

            // --- 4. 添加光源 ---

            // 环境光：柔和的全局光照，避免完全黑暗
            const ambientLight = new THREE.AmbientLight(0xaaaaaa, 0.4);
            scene.add(ambientLight);

            // 定向光：模拟太阳光，提供清晰的阴影和高光
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(5, 5, 5).normalize();
            scene.add(sunLight);

            // 监听窗口大小变化
            window.addEventListener('resize', onWindowResize, false);
        }

        // 窗口大小变化处理函数
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 5. 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            // 保持轨道控制器更新（用于阻尼效果）
            controls.update();

            if (moon) {
                // 使月球自动旋转 (自转)
                // 这里的速度可以根据需求调整，0.003 是一个比较慢速和平稳的旋转
                moon.rotation.y += 0.003;
            }

            // 渲染场景
            renderer.render(scene, camera);
        }

        // 确保在窗口加载完成后初始化和启动动画
        window.onload = function () {
            init();
            animate();
        }
    </script>
</body>

</html>

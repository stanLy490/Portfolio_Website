 <!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小行星追踪系统 (简化)</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 🎬 无黑屏转场系统 V2 - 内联脚本 -->
    <style id="transition-inline-style">
      #transition-inline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #0b0b0b;
        z-index: 999999;
        opacity: 1;
        pointer-events: all;
      }
    </style>
    <script id="transition-inline-script">
    (function() {
      try {
        const isFromTransition = sessionStorage.getItem('transition-active') === 'true';
        const timestamp = parseInt(sessionStorage.getItem('transition-timestamp') || '0');
        const isRecent = (Date.now() - timestamp) < 10000;
        if (isFromTransition && isRecent) {
          document.write('<div id="transition-inline-overlay"></div>');
        }
      } catch (e) {}
    })();
    </script>

    <style>
        /* 设置画布为全屏，只使用黑白色调 */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            /* 纯黑背景 */
        }

        canvas {
            display: block;
            background-color: #000;
            /* 纯黑画布背景 */
        }

        /* 目标指示器 (用于固定连线终点) */
        .target-indicator {
            position: absolute;
            top: 80%;
            right: 50%;
            transform: translate(50%, -50%);
            width: 15px;
            height: 15px;
            background-color: #fff;
            /* 白色 */
            border-radius: 50%;
            box-shadow: 0 0 10px 3px rgba(255, 255, 255, 0.5);
            /* 柔和白光 */
            z-index: 5;
        }

        /* 右下角返回链接 */
        .bottom-right-link {
            position: fixed;
            bottom: 30px;
            right: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 60;
            opacity: 0;
            animation: fadeInLink 1.5s ease-in-out 1s forwards;
        }

        .bottom-right-link:hover {
            color: rgba(255, 255, 255, 1);
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(30, 111, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 111, 255, 0.4);
        }

        @keyframes fadeInLink {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <canvas id="starfieldCanvas"></canvas>

    <!-- 目标指示器：固定连线点 -->
    <div class="target-indicator"></div>

    <!-- 右下角返回链接 -->
    <a href="#" id="back-to-main-link" class="bottom-right-link">← Back to Main</a>

    <!-- 🎵 音频系统 -->
    <link rel="stylesheet" href="../Audio/volumeControl.css">
    <script src="../Audio/musicPlayerBridge.js"></script>
    <script src="../Audio/volumeControl.js"></script>
    <script src="../Audio/musicConfig.js"></script>

    <!-- 🎬 页面转场系统 V2 -->
    <link rel="stylesheet" href="../Transition/transition-final.css">
    <script src="../Transition/transition-final.js"></script>

    <!-- 引入外部 JavaScript 文件 -->
    <script src="planetData.js"></script>

    <!-- 🎵 初始化音频系统 -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // 使用全局配置自动初始化音乐
            if (window.MusicConfig) {
                window.MusicConfig.autoInitMusic();
            }

            // 创建音量控制按钮
            if (window.VolumeControl) {
                window.VolumeControl.create();
            }

            // 🎬 绑定返回链接转场动画
            const backToMainLink = document.getElementById('back-to-main-link');
            if (backToMainLink && window.PageTransition) {
                backToMainLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.PageTransition.navigateTo('../MainPage/Main.html');
                });
            }

            console.log('✅ Galaxy 页面音频已初始化');
        });
    </script>

    <script src="web.js"></script>
</body>

</html>

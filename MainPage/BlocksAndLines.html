<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vitruvian Man SVG Flash</title>
    <style>
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        svg {
            width: 400px;
            height: 400px;
            stroke: white;
            fill: none;
            stroke-width: 2;
        }
    </style>
</head>

<body>
    <!-- Inline SVG so it can be manipulated directly -->
    <svg id="vitruvian" viewBox="-360 -360 720 720">
        <rect x="-300" y="-300" width="600" height="600" />
        <circle cx="0" cy="-20" r="260" />
        <!-- simplified figure -->
        <circle cx="0" cy="-180" r="28" />
        <path d="M0 -152 C -6 -120 -8 -40 0 0 C 8 40 12 120 0 152" />
        <path d="M-210 -60 L210 -60" />
        <path d="M-120 220 L120 220" />
    </svg>

    <script>
        const svg = document.getElementById('vitruvian');
        let visible = true;
        setInterval(() => {
            visible = !visible;
            svg.style.stroke = visible ? 'white' : 'transparent';
        }, 2000);
    </script>
</body>

</html>

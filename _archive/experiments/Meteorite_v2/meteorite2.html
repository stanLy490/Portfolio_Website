<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Asteroid - Ray Marching SDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="meteorite2.css">

    <!-- 🎬 无黑屏转场系统 V2 - 内联脚本 -->
    <style id="transition-inline-style">
      #transition-inline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #0b0b0b;
        z-index: 999999;
        opacity: 1;
        pointer-events: all;
      }
    </style>
    <script id="transition-inline-script">
    (function() {
      try {
        const isFromTransition = sessionStorage.getItem('transition-active') === 'true';
        const timestamp = parseInt(sessionStorage.getItem('transition-timestamp') || '0');
        const isRecent = (Date.now() - timestamp) < 10000;
        if (isFromTransition && isRecent) {
          document.write('<div id="transition-inline-overlay"></div>');
        }
      } catch (e) {}
    })();
    </script>
</head>
<body>
<canvas id="glCanvas"></canvas>

<!-- 🎵 音频系统 -->
<link rel="stylesheet" href="../Audio/volumeControl.css">
<script src="../Audio/musicPlayerBridge.js"></script>
<script src="../Audio/volumeControl.js"></script>
<script src="../Audio/musicConfig.js"></script>

<!-- 🎬 页面转场系统 V2 -->
<link rel="stylesheet" href="../Transition/transition-final.css">
    <script src="../Transition/transition-final.js"></script>

<!-- 🎵 初始化音频系统 -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
        // 使用全局配置自动初始化音乐
        if (window.MusicConfig) {
            window.MusicConfig.autoInitMusic();
        }

        // 创建音量控制按钮
        if (window.VolumeControl) {
            window.VolumeControl.create();
        }

        console.log('✅ Meteorite 页面音频已初始化');
    });
</script>

<script src="meteorite2.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - 测试版（占位图）</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="gallery-container">

        <!-- 标题区域 -->
        <div class="gallery-item text-block" data-grid-area="1 / 1 / 2 / 3">
            <h1>静态·唤醒</h1>
            <p>将鼠标悬停在照片上，唤醒色彩</p>
            <p style="font-size: 0.8em; margin-top: 10px; color: #666;">
                （使用占位图测试布局，替换为真实图片请编辑 index.html）
            </p>
        </div>

        <!-- 照片网格区域 - 使用在线占位图 -->

        <div class="gallery-item photo-block" data-grid-area="2 / 1 / 4 / 2">
            <img src="https://via.placeholder.com/600x800/FF6B6B/FFFFFF?text=Photo+1" alt="Photo 1">
            <div class="caption">作品一</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="2 / 2 / 3 / 4">
            <img src="https://via.placeholder.com/1200x600/4ECDC4/FFFFFF?text=Photo+2" alt="Photo 2">
            <div class="caption">作品二</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="3 / 2 / 5 / 3">
            <img src="https://via.placeholder.com/600x1000/45B7D1/FFFFFF?text=Photo+3" alt="Photo 3">
            <div class="caption">作品三</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="3 / 3 / 4 / 4">
            <img src="https://via.placeholder.com/600x600/F7DC6F/333333?text=Photo+4" alt="Photo 4">
            <div class="caption">作品四</div>
        </div>

        <div class="gallery-item text-block" data-grid-area="4 / 1 / 5 / 2">
            <h3>艺术与光影</h3>
            <p>每一张照片都在等待被发现</p>
            <p style="font-size: 0.85em; margin-top: 10px;">悬停在照片上，观察去色到彩色的转变</p>
        </div>

        <div class="gallery-item photo-block" data-grid-area="4 / 3 / 6 / 4">
            <img src="https://via.placeholder.com/600x1000/96CEB4/FFFFFF?text=Photo+5" alt="Photo 5">
            <div class="caption">作品五</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="5 / 1 / 6 / 3">
            <img src="https://via.placeholder.com/1200x600/FFEAA7/333333?text=Photo+6" alt="Photo 6">
            <div class="caption">作品六</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="6 / 1 / 7 / 2">
            <img src="https://via.placeholder.com/600x600/DFE6E9/333333?text=Photo+7" alt="Photo 7">
            <div class="caption">作品七</div>
        </div>

        <div class="gallery-item photo-block" data-grid-area="6 / 2 / 7 / 4">
            <img src="https://via.placeholder.com/1200x600/74B9FF/FFFFFF?text=Photo+8" alt="Photo 8">
            <div class="caption">作品八</div>
        </div>

        <div class="gallery-item text-block" data-grid-area="7 / 1 / 8 / 4">
            <h3>💡 开始使用</h3>
            <p>1. 将真实照片放入 images/ 文件夹</p>
            <p>2. 编辑 index.html，将占位图链接替换为：images/photo1.jpg</p>
            <p>3. 调整 data-grid-area 来改变照片位置</p>
            <p style="margin-top: 10px; font-size: 0.9em; color: #888;">
                详细说明请查看 README.md 或 QUICK_START.md
            </p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>

<!--
  🎬 无黑屏转场系统 - 内联脚本 V2

  复制此代码到每个页面的 <head> 标签内（越靠前越好）

  作用：
  - 在页面 HTML 解析时立即检查是否来自转场跳转
  - 如果是，立即创建并显示遮罩层（opacity=1）
  - 避免新页面加载时出现任何可见内容，确保无黑屏
-->

<style id="transition-inline-style">
  #transition-inline-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #0b0b0b;
    z-index: 999999;
    opacity: 1;
    pointer-events: all;
  }
</style>

<script id="transition-inline-script">
(function() {
  // 检查是否来自转场跳转
  try {
    const isFromTransition = sessionStorage.getItem('transition-active') === 'true';
    const timestamp = parseInt(sessionStorage.getItem('transition-timestamp') || '0');
    const isRecent = (Date.now() - timestamp) < 10000;

    if (isFromTransition && isRecent) {
      // 立即创建遮罩层（使用 document.write 确保同步渲染）
      document.write('<div id="transition-inline-overlay"></div>');
      console.log('✅ 转场遮罩层已立即显示');
    }
  } catch (e) {
    console.error('转场检查失败:', e);
  }
})();
</script>

<!--
  注意：
  1. 此脚本必须放在 <head> 中，越靠前越好
  2. transition-v2.js 会接管这个遮罩层并执行淡出动画
  3. 如果不是转场跳转，此脚本不会产生任何副作用
-->
